services:
  api:
    build:
      context: .
      dockerfile: WestcoastCars.Api/Dockerfile
    restart: unless-stopped
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=westcoast_cars;Username=postgres;Password=${POSTGRES_PASSWORD};SSL Mode=Prefer
      - apiImageUrl=http://api:8080/images/
      - JwtSettings__Secret=${JWT_SECRET}
      - AdminSettings__Password=${ADMIN_PASSWORD}
      - DataProtectionPath=/app/keys
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./dpkeys:/app/keys

  web:
    build:
      context: .
      dockerfile: WestcoastCars.Web/Dockerfile
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Services__ApiUrl=http://api:8080
      - JwtSettings__Secret=${JWT_SECRET}
      - DataProtectionPath=/app/keys
      - ImageUploadPath=/app/wwwroot/images/uploads
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./dpkeys:/app/keys
      - ./web-images:/app/wwwroot/images/uploads

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=westcoast_cars
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d westcoast_cars"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
