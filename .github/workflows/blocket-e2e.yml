name: Blocket E2E

on:
  workflow_dispatch:

# Manual-only workflow; still cap to one run at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # checkout only

jobs:
  blocket-e2e:
    name: Blocket external E2E suite
    runs-on: ubuntu-latest
    env:
      RUN_BLOCKET_E2E: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Run external Blocket E2E suite
        run: dotnet test --configuration Release --filter "Category=ExternalE2E" --logger "trx;LogFileName=blocket-e2e.trx" --results-directory ./TestResults

      - name: Upload E2E results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blocket-e2e-results
          path: TestResults/**/*.trx
