name: Blocket E2E

on:
  workflow_dispatch:

jobs:
  blocket-e2e:
    runs-on: ubuntu-latest
    env:
      RUN_BLOCKET_E2E: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Run external Blocket E2E suite
        run: dotnet test --configuration Release --filter "Category=ExternalE2E" --logger "trx;LogFileName=blocket-e2e.trx" --results-directory ./TestResults

      - name: Upload E2E results
        uses: actions/upload-artifact@v4
        with:
          name: blocket-e2e-results
          path: TestResults/**/*.trx
