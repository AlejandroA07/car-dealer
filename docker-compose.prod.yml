# Production-like environment configuration.
# This configuration simulates Docker Secrets by using a local file for the PostgreSQL password.

secrets:
  db_password:
    file: ./prod_db_password.txt

services:
  api:
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    secrets:
      - db_password

  web:
    ports:
      - "5002:8080"

  db:
    ports: []
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_PASSWORD=
    secrets:
      - db_password
