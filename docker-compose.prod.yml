# Local prod-like testing overlay — NOT used for VPS deployment.
# Simulates Docker Secrets via a local file so the secrets path can be tested
# before deploying. Exposes ports directly for local inspection.
# For VPS deployment use docker-compose.deploy.yml instead.

secrets:
  db_password:
    file: ./prod_db_password.txt

services:
  api:
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    secrets:
      - db_password

  web:
    ports:
      - "5002:8080"

  db:
    ports: []
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_PASSWORD=
    secrets:
      - db_password
