# VPS deployment overlay.
# Usage: docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d
# Secrets: POSTGRES_PASSWORD, JWT_SECRET, GUEST_VERIFICATION_SECRET, ADMIN_PASSWORD, WEB_BASE_URL must be set in a .env file
#          on the VPS (chmod 600 .env). For stronger isolation, migrate to Docker
#          Secrets by updating the API to read the password from /run/secrets/db_password.

services:
  # Public entrypoint
  web:
    ports:
      - "80:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Use the shared mounted key ring from docker-compose.yml (./dpkeys:/app/keys)
      - DataProtectionPath=/app/keys

  # Keep internal-only on the Docker network
  api:
    ports: []
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Public URL of the Web app, used to build email confirmation links
      - App__BaseUrl=${WEB_BASE_URL}

  # Remove the public database port — internal Docker network only
  db:
    ports: []
